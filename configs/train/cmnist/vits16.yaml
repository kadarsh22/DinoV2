dino:
  head_n_prototypes: 512
  head_bottleneck_dim: 512
  head_hidden_dim: 768
  head_nlayers: 3
ibot:
  separate_head: True
  head_bottleneck_dim: 512
  head_hidden_dim: 768                # smaller head is enough
  head_n_prototypes: 512
  head_nlayers: 3
lcal:
  # Adaptive tau targets 30% hard patches using the existing DINO error.
  tau_target_hard_frac: 0.3
  loss_weight: 5.0
train:
  batch_size_per_gpu: 64
  dataset_path: ImageNet22k
  centering: sinkhorn_knopp
  OFFICIAL_EPOCH_LENGTH: 50
student:
  arch: vit_small
  patch_size: 14
  drop_path_rate: 0.0
  ffn_layer: mlp
  block_chunks: 0
teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.05
  warmup_teacher_temp_epochs: 10       # shorter warmup for small dataset
optim:
  epochs: 1000
  weight_decay: 0.04
  weight_decay_end: 0.06
  base_lr: 2e-4 # learning rate for a batch size of 1024
  warmup_epochs: 10
crops:
  global_crops_scale:
  - 0.7
  - 1.0
  local_crops_number: 4
  local_crops_scale:
  - 0.15
  - 0.4
  global_crops_size: 56
  local_crops_size: 56

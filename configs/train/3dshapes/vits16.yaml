dino:
  head_n_prototypes: 512
  head_bottleneck_dim: 512
  head_hidden_dim: 768
  head_nlayers: 3
ibot:
  separate_head: True
  head_bottleneck_dim: 512
  head_hidden_dim: 768                # smaller head is enough
  head_n_prototypes: 512
  head_nlayers: 3
lcal:
  mode: cosine
  loss_weight: 1.0
  tau_start: 6.6
  tau_end: 3
  warmup_iterations: 100
train:
  batch_size_per_gpu: 64
  dataset_path: ImageNet22k
  centering: sinkhorn_knopp
student:
  arch: vit_small
  patch_size: 14
  drop_path_rate: 0.0
  ffn_layer: mlp
  block_chunks: 0
teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.05
  warmup_teacher_temp_epochs: 10       # shorter warmup for small dataset
optim:
  epochs: 1000
  weight_decay: 0.04
  weight_decay_end: 0.06
  base_lr: 2e-4 # learning rate for a batch size of 1024
  warmup_epochs: 10
crops:
  global_crops_scale:
    - 0.8
    - 1.0
  local_crops_number: 2
  local_crops_scale:
    - 0.5
    - 0.8
  global_crops_size: 56
  local_crops_size: 56

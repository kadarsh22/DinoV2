dino:
  head_n_prototypes: 1024
  head_bottleneck_dim: 256
  head_hidden_dim: 768
  head_nlayers: 3
ibot:
  separate_head: False
  head_bottleneck_dim: 256
  head_hidden_dim: 768                # smaller head is enough
  head_n_prototypes: 1024
  head_nlayers: 3
train:
  batch_size_per_gpu: 128
  dataset_path: ImageNet22k
  centering: sinkhorn_knopp
student:
  arch: vit_tiny
  patch_size: 4
  drop_path_rate: 0.0
  ffn_layer: mlp
  block_chunks: 0
teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.9
  teacher_temp: 0.01
  warmup_teacher_temp_epochs: 1       # shorter warmup for small dataset
optim:
  epochs: 300
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 2e-4  # learning rate for a batch size of 1024
  warmup_epochs: 10
  clip_grad: -1
crops:
  global_crops_scale:
  - 0.4
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.15
  - 0.4
  global_crops_size: 28
  local_crops_size: 28
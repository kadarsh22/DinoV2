dino:
  head_n_prototypes: 512
  head_bottleneck_dim: 512
  head_hidden_dim: 768
  head_nlayers: 3
ibot:
  separate_head: True
  head_bottleneck_dim: 512
  head_hidden_dim: 768                # smaller head is enough
  head_n_prototypes: 512
  head_nlayers: 3
lcal:
  mode: cosine
  loss_weight: 0.0
  tau_start: 6.6
  tau_end: 3
  warmup_iterations: 100
train:
  batch_size_per_gpu: 64
  dataset_path: ImageNet22k
  centering: sinkhorn_knopp
student:
  arch: vit_small
  patch_size: 8
  drop_path_rate: 0.0
  ffn_layer: mlp
  block_chunks: 0
crops:
  global_crops_scale:
  - 0.5
  - 1.0
  local_crops_number: 4
  local_crops_scale:
  - 0.15
  - 0.4
  global_crops_size: 64
  local_crops_size: 40
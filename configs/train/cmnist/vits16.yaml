dino:
  head_n_prototypes: 512
  head_bottleneck_dim: 256
  head_hidden_dim: 256
  head_nlayers: 4
ibot:
  separate_head: True
  head_bottleneck_dim: 512
  head_hidden_dim: 256                # smaller head is enough
  head_n_prototypes: 256
  head_nlayers: 4
lcal:
  loss_weight: 1.0
  tau_start: 0.5
  tau_end: 0.1
  warmup_epochs: 10
train:
  batch_size_per_gpu: 64
  dataset_path: ImageNet22k
  centering: sinkhorn_knopp
  OFFICIAL_EPOCH_LENGTH: 50
student:
  arch: vit_tiny
  patch_size: 4
  drop_path_rate: 0
  ffn_layer: mlp
  block_chunks: 0
teacher:
  momentum_teacher: 0.996
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.9
  teacher_temp: 0.01
  warmup_teacher_temp_epochs: 1       # shorter warmup for small dataset
optim:
  epochs: 30
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.00001 # learning rate for a batch size of 1024
  warmup_epochs: 10
  layerwise_decay: 1.0
  patch_embed_lr_mult: 1.0
crops:
  global_crops_scale:
  - 0.4
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.4
  global_crops_size: 28
  local_crops_size: 28